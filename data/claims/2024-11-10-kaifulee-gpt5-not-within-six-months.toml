[claim]
id = "2024-11-10-kaifulee-gpt5-not-within-six-months"
speaker_id = "kaifulee"
when = "2024-11-10"
when_note = "Zhang Xiaojun's podcast published the interview on Tencent News on 2024-11-10 (https://page.om.qq.com/page/OIApvGQF709LSRibGVcWH5Bg0); it may have been recorded a few days earlier. Recode China AI's English translation is dated 2024-11-22."
occasion = "Interview with Zhang Xiaojun for Tencent News' Qianwang podcast, 'If the US forms an AGI hegemony, what should we do?'"
source_kind = "coverage_only"
source_url = "https://recodechinaai.substack.com/p/kai-fu-lee-on-us-agi-hegemony-openais"
source_locator = "his answer on what he learned in Silicon Valley, the second bullet about OpenAI"
checked_how = "Read Recode China AI's English translation on 2026-10-19 (through r.jina.ai). The original is a Chinese audio podcast with no captions or transcript, so the words could not be checked against it; its chapter list carries the matching heading quoted in reported_as. Entered as coverage."
reported_as = "Recode China AI, English translation of the Qianwang interview (2024-11-22): 'GPT-5 was originally supposed to be released by now, but at this rate, even if it does launch, it won't be for another six months at the earliest.' The podcast's chapter list has the heading 'OpenAI还藏了很多牌，我们千万不要低估它' for this part."
prediction = "Because its training had not gone smoothly, OpenAI's GPT-5 would not come out for at least another six months from November 2024, that is not before May 2025, 'even if it does launch'."
kind = "timing"
bar = "A forecast that something will not happen by a date (the method's reading 2): it comes true if OpenAI has released no model called GPT-5 by 2025-05-31, and fails if it has."
due = 2025
due_basis = "'another six months at the earliest', said by 2024-11-10: May 2025; the month sets due_date to 2025-05-31."
due_date = 2025-05-31
status = "hit"
verdict_on = 2025-05-31
verdict_why = "No model called GPT-5 had been released by 2025-05-31. OpenAI released GPT-5 on 2025-08-07, nearly nine months after he spoke, so it did not come within the six months he ruled out."
verdict_source = "https://openai.com/index/introducing-gpt-5/"
evidence_by = "outside"
search_ids = ["kaifulee-claims-025", "kaifulee-claims-029", "kaifulee-claims-051", "kaifulee-claims-067"]
notes = "Role at the time: founder and chief executive of 01.AI (Lingyi Wanwu), which he founded in March 2023 to build large language models; he announced the company on 2023-03-19/20 and still leads it. Judgement: a forecast about another company's AI model, admitted as a claim that an AI system will not ship before a date. Hedged: 'even if it does launch'. The release date is from OpenAI's announcement and Wikipedia's GPT-5 article."
