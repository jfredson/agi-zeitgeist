search_ids = ["zuckerberg-claims-062", "zuckerberg-claims-025", "zuckerberg-claims-026", "zuckerberg-claims-027", "zuckerberg-claims-078", "zuckerberg-claims-079", "zuckerberg-claims-080"]
notes = "Role at the time: founder and chief executive of Meta (Facebook). Marked as a goal ('my goal was'). Repeated on the second-quarter 2024 earnings call (2024-07-31): 'on track to achieve our goal of becoming the most used AI assistant by the end of the year'. Changed before merging on 2026-10-19: it was scored as came true on Meta's own statement that no assistant was used more; under the re-pass rule of that day a maker's statement about its rivals needs an outside comparison, none was found, so the condition is not shown and the claim is scored as not come true. The test now says so; it read 'shown by user counts from Meta or outside counts'."
