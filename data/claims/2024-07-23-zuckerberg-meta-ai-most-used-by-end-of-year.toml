verdict_why = "The comparison with rivals is not shown. Meta's own counts show Meta AI's size: more than 500 million monthly users on 2024-10-30 and more than 700 million on 2025-01-29. That it was used by more people than any other assistant rests only on his own words of 2025-01-29, 'Meta AI is already used by more people than any other assistant': a maker's statement about its rivals, which needs an outside comparison. No outside count comparing assistants for the end of 2024 was found. Meta counts anyone who used Meta AI inside its apps each month, while rivals mostly reported weekly users. The only outside comparison found, a Pew survey of US adults in February 2026, put ChatGPT far ahead (44 percent against 14 percent), though it is later and covers only the United States."
verdict_source = "https://s21.q4cdn.com/399680738/files/doc_financials/2024/q4/META-Q4-2024-Earnings-Call-Transcript.pdf"
