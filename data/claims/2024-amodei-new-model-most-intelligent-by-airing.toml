notes = "Role at the time: co-founder and chief executive of Anthropic (since 2021). Hedged with 'probably'. Not in the seed list. Status changed before merging on 2026-10-19 from came true to did not: the earlier pass had not checked outside leaderboards, and the hit rested on Anthropic's own evaluations; a maker's statement about its rivals needs an outside comparison. The day of the recording is not stated, so 'when' is the year; his other claims from this episode carry the publication date, 2024-06-26, with a note that it was recorded earlier. Reason rewritten before merging on 2026-10-19, after the independent check found an outside benchmark (LiveBench) that put it first: the outside record is split, and I ruled the status the same day."
