notes = "Role at the time: founder and chief executive of Meta (Facebook). Hedged with 'I am optimistic'. In the same answer he said 99 percent of the ISIS and al-Qaida content Facebook removed was flagged by AI first, and that for hate speech 'today, we are just not there'. The bar's 'most hate speech is found by the systems' is a plain reading of his contrast between AI flagging and people flagging."
