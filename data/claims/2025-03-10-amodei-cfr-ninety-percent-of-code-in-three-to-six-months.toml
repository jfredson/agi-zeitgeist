notes = "Role at the time: co-founder and chief executive of Anthropic (since 2021). Judgement call, flagged for John: whose code is not stated. Read as all code, it plainly missed; read as Anthropic's code, the outside estimate says it fell short on average, and he claimed at Dreamforce in October 2025 that 'within Anthropic and within a number of companies that we work with, that is absolutely true'. On 2026-02-13 he called 90 percent of code 'a very weak criterion' and said people took it to mean 90 percent fewer engineers. The seed list of 2026-10-17 also had this as missed."
