[claim]
id = "2024-12-05-suleyman-copilot-vision-general-availability-early-2025"
speaker_id = "suleyman"
when = "2024-12-05"
when_note = "The Rundown AI uploaded the interview on 2024-12-05, the day Microsoft put Copilot Vision into preview."
occasion = "Interview with Rowan Cheung, The Rundown AI, on the launch of Copilot Vision"
source_kind = "transcript"
source_url = "https://www.youtube.com/watch?v=dQP2zLYmCG8"
source_locator = "0:16:50 to 0:17:12 into the video"
checked_how = "Read YouTube's automatic English captions of the The Rundown AI channel's own upload on 2026-10-19 (no punctuation, some stutters and fillers); the quote is a verbatim run of those caption words."
quote = "sometime next year uh in the early part of next year it will go into GA and lots of people get access to it"
prediction = "Copilot Vision, Microsoft's AI that sees the web pages a user is looking at, then in a limited preview, would become generally available in the early part of 2025, so that lots of people get access to it."
kind = "deployment"
bar = "By 2025-03-31 (the early part of the year read as its first quarter, under my ruling of 2026-10-19), Copilot Vision goes into general availability, so that 'lots of people get access to it', rather than a limited preview group of paying subscribers, shown by Microsoft's release or reporting of it."
due = 2025
due_date = 2025-03-31
due_basis = "'in the early part of next year', said 2024-12-05: under my ruling of 2026-10-19, 'early' in a year is its first quarter, so the due date is 2025-03-31."
status = "missed"
verdict_on = 2025-04-16
verdict_why = "Not by 2025-03-31: no wider release of Copilot Vision between the preview of 2024-12-05 (paying Copilot Pro subscribers, in Copilot Labs) and the end of March 2025 was found. It came later: on 2025-04-16 Suleyman posted 'Copilot Vision is out now, free in Edge', opening it to every user of Microsoft's Edge browser in the United States (Windows Central, 2025-04-17), and Microsoft's post of 2025-06-12 says Copilot Vision on Windows 'is available now in the US'."
verdict_source = "https://www.windowscentral.com/software-apps/browsing/microsoft-removes-the-paywall-for-copilot-vision-but-only-for-edge-users/"
evidence_by = "maker"
direction = "later"
search_ids = ["suleyman-claims-013", "suleyman-claims-031", "suleyman-claims-052", "suleyman-claims-057", "suleyman-claims-060"]
notes = "Role at the time: chief executive of Microsoft AI (from 2024-03-19). 'GA' is the industry's 'general availability'. Microsoft kept the feature under the Copilot Labs label even after April 2025, so a strict reading of general availability would put it later still; the plain reading taken is that lots of people got access. Test changed before merging on 2026-10-19: it read 'By 2025-06-30 (the early part of the year read as its first half)', and the claim was a hit on Microsoft's post of 2025-06-12; it now reads the first quarter, because I ruled on 2026-10-19 that 'early' in a year means its first quarter, after the independent check of the same day found the first-half reading used only where it made a hit. The status changed from came true to did not come true, later. Marked as the maker's word: the only records are Microsoft's and Suleyman's own, as reported."
