notes = "Said as chief executive of Microsoft AI. Judgement call: the answer says 'our own superintelligence' and then 'sometime this year'; read with the question, 'this year' dates the model, not superintelligence, and the claim is entered that way (read the other way it would be a named stage with no definition, so untestable). Earlier in the interview: 'We have to develop our own foundation models which are at the absolute frontier with gigawatt scale compute.' Microsoft AI had already released a model of its own (MAI-1-preview) in August 2025, so the bar asks for a new, frontier-class one. Seen so far, settling nothing before the date: at Microsoft Build 2026 (Microsoft's upload of 2026-06-03) he unveiled seven MAI models, among them MAI Thinking 1, which he placed 'in the medium size weight class'; on Bloomberg Tech (2026-09-25) he said Microsoft AI's frontier-scale language and coding models would be out 'later this year' and in spring 2027 (recorded as a restatement)."
