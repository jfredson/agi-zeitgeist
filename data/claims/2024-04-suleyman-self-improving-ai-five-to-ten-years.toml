[claim]
id = "2024-04-suleyman-self-improving-ai-five-to-ten-years"
speaker_id = "suleyman"
when = "2024-04"
when_note = "Given at TED2024 in Vancouver (held 2024-04-15 to 2024-04-19); TED uploaded it on 2024-04-22. The exact day is not stated, so the month is recorded."
occasion = "TED talk 'What Is an AI Anyway?' and conversation with Chris Anderson, TED2024"
source_kind = "transcript"
source_url = "https://www.youtube.com/watch?v=KKNCiRWd_j0"
source_locator = "0:19:50 to 0:20:20 into the video"
checked_how = "Read TED's English captions of its own upload on 2026-10-19 (punctuated); the quote is a verbatim run of those caption words."
quote = "I think it's still a good five to 10 years before we have to really confront that."
prediction = "AI that can recursively improve itself (update its own code, explore an environment without oversight, change how it operates without a human in control) is 'still some way away': 'still a good five to 10 years' before it has to be confronted, so not before about 2029."
kind = "capability"
bar = "A forecast that something will not happen before a date, in his words: the claim holds if, by the end of 2029, no AI system has been shown, by its maker or an outside body, able to 'independently self-improve, update its own code, explore an environment without oversight, and ... without a human in control to change how it operates'; it fails if one has been shown before then."
due = 2029
due_basis = "A floor: 'still a good five to 10 years before' from April 2024 says not before five years at the least, so the earlier end is the date the words commit to. Five years from April 2024 is April 2029; under the span rule it is judged at the end of 2029. The outer figure, ten years, is not scored."
status = "not_yet_due"
search_ids = ["suleyman-claims-013", "suleyman-claims-027", "suleyman-claims-062", "suleyman-claims-063"]
notes = "Role at the time: chief executive of Microsoft AI (from 2024-03-19). 'That' refers to the preceding sentence: an AI able to 'recursively self-improve, update its own code, explore an environment without oversight, and ... without a human in control'. Restated with a changed window on 2025-12-12, as a forecast that the abilities 'start to emerge' within 5, maybe 10, years from then. Test changed before merging on 2026-10-19: it read 'by the end of 2034, an AI system shown ... to improve itself by changing its own code or training and to act in an open environment without a person overseeing each step' (due 2034, earlier end 2029), now a test that the thing does not arrive before the end of 2029, because his words set a floor ('still a good five to 10 years before'), not a deadline, and under my ruling of 2026-10-19 a forecast that something will not happen by a date is scored at that date; the old test could have scored early arrival as a hit, the opposite of what he said. Seen so far, deciding nothing before the date: the Darwin Godel Machine of 2025-05-29 rewrites its own code, but its authors ran every experiment with 'sandboxing, human oversight'."
