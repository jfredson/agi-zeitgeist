verdict_why = "No company, Meta included, showed an AI that does the work of a mid-level engineer by the end of 2025. Meta's own account on 2026-01-28 was of tools that help its engineers ('a 30% increase in output per engineer', mostly from agentic coding), not of an AI working as an engineer. The outside measure closest to the question, METR's test of how long a software task an AI can finish, reported on 2025-12-21 its best result to date: about 4 hours 49 minutes at a 50 percent success rate and 27 minutes at 80 percent, well short of the work a mid-level engineer is trusted with. He himself softened the claim during the year (2025-04-30: 'starting to become possible sometime this year, scaling into next year')."
