notes = "Role at the time: founder and chief executive of Meta (Facebook). Hedged with 'probably'. Repeated on the fourth-quarter 2024 earnings call (2025-01-29): '2025 will be the year when it becomes possible to build an AI engineering agent that has coding and problem-solving abilities of around a good mid-level engineer'. Test changed before merging on 2026-10-19: it read '... meaning carry out multi-day engineering tasks in a real codebase reliably without close supervision', conditions he did not state, now his own words (an AI that 'can effectively be a sort of midlevel engineer that you have at your company that can write code'). The verdict is unchanged. Judgement call: a reader who counts late-2025 coding agents as mid-level engineers would score this differently."
