search_ids = ["pichai-claims-026", "pichai-claims-042", "pichai-claims-064", "pichai-claims-065"]
notes = "Role at the time: chief executive of Google from 2015-10-02 and of its parent Alphabet from 2019-12-03; Google builds the Gemini models and its own AI chips. The first Gemini models came on 2023-12-06, before 2024; they are not counted towards this claim. Ultra 1.0 was announced that day but first released on 2024-02-08, so it counts as a 2024 release. The test was first met by two public releases on 2024-05-14, the verdict date. Changed before merging on 2026-10-19: the record was the 2.0 Flash post alone, and the reason wrongly called 1.5 Pro's February preview a release to the public."
