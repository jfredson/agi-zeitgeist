verdict_why = "Google released new Gemini models to the public across 2024: Gemini 1.0 Ultra on 2024-02-08, through the paid Gemini Advanced in more than 150 countries ('Today we're launching Gemini Advanced ... access to Ultra 1.0'); Gemini 1.5 Flash on 2024-05-14, open to developers in Google AI Studio; and Gemini 2.0 Flash on 2024-12-11, 'available to all Gemini users' as an experimental model. Gemini 1.5 Pro, shown in February 2024, came then only as a limited preview for developers and business customers, so it is not counted for that month."
