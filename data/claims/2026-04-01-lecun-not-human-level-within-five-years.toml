notes = "Role at the time: founder and chairman of Advanced Machine Intelligence (AMI Labs), the Paris company he set up after leaving Meta at the end of 2025 to build AI models of the world. He called himself its executive chairman in MIT Technology Review (2026-01-22), and Brown University's page of 2026-04-01 says the same, while Agence France-Presse's report of 2026-03-10 calls him its non-executive chairman; he is its chair either way. Treated as a qualifying founder-leader or chair role, a judgement flagged for the lead. Adds a longer floor to the January 2026 claim: he kept the two-year floor (entered there as a repeat of this day) and added that, at the very best, machines would not reach human intelligence within five years, to 2031. In the same sentence run he says it is 'not going to happen next year, despite what Elon Musk has been saying' and 'not going to happen in two years, despite what Dario Amodei has been saying'; those are inside the two- and five-year claims and not entered separately."
