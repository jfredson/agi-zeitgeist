bar = "By 2028-12-31, a new medicine, meaning a molecule never before approved anywhere for any use, whose developer said publicly before the result that AI found its biological target or designed the molecule itself, either completes a phase 3 (final-stage) trial that meets its main goal, or receives full approval (not conditional, emergency or accelerated approval) from the US Food and Drug Administration, the European Medicines Agency, the UK Medicines and Healthcare products Regulatory Agency, China's National Medical Products Administration or Japan's Pharmaceuticals and Medical Devices Agency. Only results announced after 2026-10-21 count. Not counted: an existing drug found by AI for a new use; a molecule picked from an existing library with AI's help but not designed by it; and a molecule designed by physics-based computer modelling that its developer does not call AI."
