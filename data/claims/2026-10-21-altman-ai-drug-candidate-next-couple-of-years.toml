notes = "Role at the time: chief executive of OpenAI (co-chair from its founding in 2015 to March 2019, chief executive since), a company that builds frontier AI models. 'I would hope' is a hedge, kept in the prediction and scored at face value. He does not say the candidate will come from OpenAI; the answer follows his point that what worked for math 'is going to work for biology'. Compare 2024-02-23-hassabis-ai-designed-drugs-in-clinic-couple-of-years and 2026-09-08-zuckerberg-ai-starts-designing-treatments. Test chosen on John's ruling of 2026-10-23, given through the weekend coordinating session: use the stronger reading of \"the first like really major thing\" and check that no existing drug already meets it. Checked at the sources on 2026-10-23: Mprosevir (Westlake University, mild to moderate COVID-19) received conditional approval from China's National Medical Products Administration, announced 2026-09-02, and its developers say AI narrowed a library screen to nine candidates (Global Times, https://www.globaltimes.cn/page/202609/1369691.shtml), so it is excluded twice, by date and as picked rather than designed; zasocitinib (Takeda, psoriasis) met its phase 3 goals and has a US decision due in the first quarter of 2027 (Takeda, 2026-09-14), but Takeda does not describe it as found or designed by AI, so it does not count; baricitinib's approval for COVID-19 (2022) was an existing drug given a new use. The candidate the test is built to catch is rentosertib (Insilico Medicine, idiopathic pulmonary fibrosis), which its developer calls a generative-AI-driven drug from target to molecule and which dosed the first patient in a phase 3 trial on 2026-09-10 with 52 weeks of treatment (Insilico, https://insilico.com/news/isn1009261-insilico-medicine-doses-first-patient-genesis-ipf-3); Insilico expects three to four years from the start of phase 3 to approval, so a phase 3 result by the end of 2028 is possible and an approval is unlikely. John approved this test as written on 2026-10-23, and chose not to require that the disease be a leading cause of death or disability (rentosertib's disease is not one)."
