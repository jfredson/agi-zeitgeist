notes = "Role at the time: chief executive of Google from 2015-10-02 and of its parent Alphabet from 2019-12-03; Google builds the Gemini models and its own AI chips. Judgement call on who said it: on stage the line was spoken by Sissie Hsiao, head of the Gemini app, but it is printed in Pichai's own published remarks, so it is entered as his written words. The 2-million-token window did reach developers through Google's programming interface in June 2024; that is a different product."
