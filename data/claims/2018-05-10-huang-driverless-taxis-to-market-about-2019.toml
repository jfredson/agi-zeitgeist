notes = "Qualifying role: chief executive of Nvidia. Judgement call: Waymo's 2020 post says it had 'for the last year ... pioneered fully driverless, paid rides' for early riders, which conflicts with TechCrunch's report that the 2019 rides were free; the dated 2019 record is preferred. Read loosely, 'about 2019' could stretch to October 2020; the method scores the year named. Waymo One with safety drivers began in December 2018, which does not meet 'driverless'."
