notes = "Said as co-founder and chief executive of Inflection AI (the essay's own bio line; Inflection founded 2022-03, he left for Microsoft 2024-03). He restated the test with a firm date, 'this year', in a Financial Times interview published 2026-02-12 (2026-02-12-suleyman-modern-turing-test-this-year). The test also appears in his book The Coming Wave (2023-09), not opened. The seed list of 2026-10-17 had this as unfalsifiable for the same reason; unchanged."
