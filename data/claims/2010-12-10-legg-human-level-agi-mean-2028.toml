notes = "Role at the time: DeepMind was incorporated on 2010-09-23 and launched on 2010-11-15; Legg was one of its three co-founders and in its leadership (Google DeepMind's own podcast of 2022-02-15 calls him 'co-founder and chief scientist'; his title in 2010 and 2011 is not on record in the sources read). DeepMind was then a small company building AI at the research frontier; he is taken as a founder-leader of it, a judgement flagged for me. He wrote on his personal blog, not for the company. Test changed before merging on 2026-10-19: it read \"The post defines nothing beyond 'roughly human level', a named comparison, so the plainest reading is taken: a machine about as capable as a typical person across thinking tasks, shown by its maker or an outside body, or his own word that it has arrived.\"; the claim is now marked as one that cannot be tested, under my reading of the same day that bare 'human level' with no comparison in the same source is a named stage. His later repeats of this same prediction (TED, 2023-10-17; the Dwarkesh Podcast, 2023-10-26; Google DeepMind's podcast, 2025-12-11) do define the level, as 'the sorts of cognitive things that people can typically do'; the record does not borrow that definition, because the test is taken from the claim's own source. Whether a repeat that adds a definition should become its own scored record is a question for me. Repeats, unchanged in year: a printed question-and-answer on LessWrong (2011-06-17, '2018, 2028, 2050' for 10%, 50% and 90%); 'Goodbye 2011' (2011-12-31); TED AI with Chris Anderson (2023-10-17, 'I predicted a 50 percent chance of AGI by 2028. I still believe that today'); the Dwarkesh Podcast (2023-10-26, 'a 50% chance that we have AGI by 2028'); a post on X (2024-12-13, 'I've been predicting a 50% chance of AGI by 2028 for 20 years'); Google DeepMind's podcast (2025-12-11, 'are you still 50/50 by 2028?' 'Yes'). The seed list's separate records for 2023-10-26 and 2025-12-11 are folded in here as unchanged repeats. His later sources define the level: 'a machine that can do the sorts of cognitive things that people can typically do, possibly more' (2023-10-26), renamed 'minimal AGI' on 2025-12-11, where he also gives a test an outsider could run: a battery of thousands of tasks with known typical human scores, then a team given a month or two to find any task a typical person can do and the AI cannot. That definition is not borrowed for this record's test (see above). A stated chance, so out of the plain count. On 2022-02-15 he gave the date as 'around 2030-ish' instead (its own record)."
arrives = "agi"
arrives_term = "roughly human-level AGI"
form = "year"
