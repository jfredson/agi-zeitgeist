quote = "decided to play it safe and keep the prediction unmoved at 2028."
statement_id = "legg-2010-02"
prediction = "Roughly human-level artificial general intelligence (AGI) around 2028, the average of the spread of chances he gives (its peak is 2025), which he calls 'the prediction'. From 2011 he states it as a 50% chance by 2028."
kind = "timing"
bar = "None an outsider can run. The post names 'roughly human level AGI' with no comparison or definition; in his reply on the same page (2010-12-18) he agrees that whether 'human level AGI' is meaningful 'is a problem', and offers only people's 'intuitive evaluation' that a system is 'actually fairly intelligent', which is not a test anyone could run. Under my reading of 2026-10-19, bare 'human level' with no comparison in the same source is a named stage, like an undefined 'AGI', and cannot be tested."
