notes = "Role at the time: co-founder and chief AGI scientist of Google DeepMind, named as such. A judgement flagged for John: the brief treats words that are only a lower bound as unfalsifiable, but its example is a 'could be as soon as' possibility, where missing the date proves nothing; this is the reverse, a forecast that the thing will not come before a date, which would have been shown wrong had it come in 2024 or 2025. The 50% by 2028 in the same answer is a repeat in 2010-12-10-legg-human-level-agi-mean-2028."
