[claim]
id = "2010-12-10-legg-human-level-agi-mode-2025"
speaker_id = "legg"
when = "2010-12-10"
when_note = "The post's header reads 'Posted on 10 December, 2010'."
occasion = "Year-end blog post 'Goodbye 2010' on his personal blog, vetta.org"
source_kind = "own_words"
source_url = "https://www.vetta.org/2010/12/goodbye-2010/"
source_locator = "the paragraph beginning 'My longest running prediction, since 1999'"
checked_how = "Read on the page on 2026-10-19 (curl); the date line was seen."
quote = "Basically, I gave it a log-normal distribution with a mean of 2028, and a mode of 2025."
statement_id = "legg-2010-02"
prediction = "Roughly human-level artificial general intelligence (AGI), with 2025 as his single most likely year: the peak (mode) of the spread of chances he gives, whose average is 2028."
kind = "timing"
bar = "The post defines nothing beyond 'roughly human level', a named comparison, so the plainest reading is taken: a machine about as capable as a typical person across thinking tasks, shown by its maker or an outside body, or his own word that it has arrived."
due = 2025
due_basis = "The mode of his stated spread, 2025, is his most likely year; judged at 2025-12-31. The average (2028) and the 90% range are separate records, as the method says for a point year with a spread beside it."
