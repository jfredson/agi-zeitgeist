repeated_on = [2011-12-31]
status = "missed"
verdict_on = 2025-12-31
verdict_why = "By the end of 2025 no machine had been shown to do the thinking work a typical person can do. On 2025-12-11 Legg himself said of today's systems, against his own bar for this level ('the kinds of cognitive things people can typically do'), 'we're not there yet'. The year is the peak of a stated spread of chances, so the claim is kept out of the plain count and listed for a later check of his calibration."
verdict_source = "https://www.youtube.com/watch?v=l3u_FAv33G0"
evidence_by = "maker"
direction = "not_come"
search_ids = ["legg-claims-001", "legg-claims-002", "legg-claims-003", "legg-claims-005", "legg-claims-007", "legg-claims-012"]
notes = "Role at the time: DeepMind was incorporated on 2010-09-23 and launched on 2010-11-15; Legg was one of its three co-founders and in its leadership (Google DeepMind's own podcast of 2022-02-15 calls him 'co-founder and chief scientist'; his title in 2010 and 2011 is not on record in the sources read). DeepMind was then a small company building AI at the research frontier; he is taken as a founder-leader of it, a judgement flagged for John. He wrote on his personal blog, not for the company. The seed list of 2026-10-17 entered the 2009-12-07 post ('roughly human level AGI in the year 2025') as missed; that post was written before DeepMind existed, so it is left out under the role rule, and this restatement of the same peak year a year later, after the founding, is entered instead. The peak year was restated unchanged on 2011-12-31 ('a mean of 2028 and a mode of 2025')."
