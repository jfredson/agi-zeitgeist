notes = "Role at the time: Meta's Chief AI Scientist (2018 to the end of 2025), the company's named chief scientist speaking for it. The quote differs from the statement: the row lecun-2025-02 has TechCrunch's tidied wording ('systems that are a completely different paradigm'), and this record keeps the caption words. Repeated with the same dates on the Big Technology Podcast published 2025-03-19 ('it's not going to happen within the next three years but it may happen ... between 3 to 5 years') and in Newsweek's interview of 2025-04-02 ('if we can make this work within three to five years, we'll have a much better paradigm'). Also said, on days not fixed, at Imagination in Action's Davos event (January 2025) and in his inaugural lecture at the École des Ponts (uploaded 2025-10-27); at MIT's symposium (uploaded 2025-10-21) he recalled having predicted that 'within three to five years this will be the dominant model'. The 'emergence' is read as an established approach, not a single paper, from his own usage in the same session: he calls large language models 'the current paradigm', whose 'shelf life ... is fairly short', so a new paradigm is the approach that takes its place. Captions re-read on 2026-10-19."
