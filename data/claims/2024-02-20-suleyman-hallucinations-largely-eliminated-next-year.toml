notes = "Role at the time: still chief executive of Inflection AI (he moved to Microsoft on 2024-03-19). Coverage only: no primary source was found after searching YouTube and the web. A changed repeat of the claim of 2023-06-10, earlier in date (about February 2025 instead of June 2025) and with a different condition, so it is a new record; the earlier claim keeps its own due date and verdict. Test changed before merging on 2026-10-19: it read 'None an outsider could apply: this occasion gives no measure for largely eliminated, and as accurate as any content that you can find on the web has none either', now a plain test from his comparison with content on the web, because the independent check of 2026-10-19 found that the comparison is a named one, which under John's ruling on named comparisons gives a test; the status changed from cannot be tested to did not come true. The study cited was published by the BBC; it measured answers about the news only, which is the kind of web content his comparison names."
