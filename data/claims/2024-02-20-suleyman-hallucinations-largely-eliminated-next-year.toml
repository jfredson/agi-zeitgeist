verdict_why = "Not met by the end of 2025. In the largest outside check of the year, published 2025-10-22, journalists from 22 public broadcasters, in a study run by the European Broadcasting Union and led by the BBC, judged more than 3,000 answers about the news from ChatGPT, Copilot, Gemini and Perplexity: 20% 'contained major accuracy issues, including hallucinated details and outdated information', and 45% had at least one significant issue. Answers that get the news they draw on badly wrong one time in five are not as accurate as that news, and made-up details were not largely eliminated. OpenAI's own measurement of everyday ChatGPT answers (its GPT-5 system card, 2025-08-13) found the same order of error: 11.6% to 22% of answers with at least one major factual error, depending on the model."
