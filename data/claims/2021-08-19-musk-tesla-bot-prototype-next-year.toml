notes = "Role at the time: chief executive of Tesla (counted by my ruling of 2026-10-19), Tesla then counting as a company building frontier AI; he had left OpenAI's board in February 2018 and founded xAI only in 2023. (Role note added before merging on 2026-10-19.) Test changed before merging on 2026-10-19, after the independent check found it held no condition about AI and so read as a plain hardware date: it read 'A physical Tesla humanoid robot prototype shown in public by the end of 2022.'; it now carries his own words from the same talk, which make the robot an AI system (it runs the cars' self-driving computer and neural networks), and his 'basically looks like this', which the old test had dropped. The verdict is unchanged: the 2022 event showed both. The demonstration was public and is on video, so the maker's mark here means the event was Tesla's own, not that the record rests on a statement."
