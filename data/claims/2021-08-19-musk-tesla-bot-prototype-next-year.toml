verdict_why = "At Tesla AI Day on 2022-09-30 a Tesla humanoid robot (the rough development robot, Bumble C) walked on stage, 'the first time we try this robot without any backup support'; a presenter said it ran 'essentially the same self-driving computer that runs in your Tesla cars' (18:26), and in the video shown of it the presenters said 'you can see the autopilot neural networks running as is, just retrained for the bot' (19:52). The same evening a second prototype with Tesla's own actuators, 'fairly close to what will go into production', was brought on stage, though it did not yet walk. 'Basically looks like this' names no detail; both were humanoid robots of the kind shown in 2021, and the second was the design carried towards production. Every part of the test was shown by the date."
