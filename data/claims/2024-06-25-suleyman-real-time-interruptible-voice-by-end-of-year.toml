notes = "Role at the time: chief executive of Microsoft AI (from 2024-03-19). 'We' is read as the field, not Microsoft alone: re-read in the captions on 2026-10-19, he is answering a teacher's question about how teachers can use AI, and nothing in the answer names Microsoft or Copilot. Google is not his company, so the evidence is marked outside, though it is Google's description of its own product. Record changed before merging on 2026-10-19: the earlier record, OpenAI's Voice mode FAQ as captured 2024-12-26, speaks only of 'preventing interruptions' by background noise and never says the user can interrupt the AI, so the independent check of 2026-10-19 asked for a record that says so; the verdict date moved from 2024-09-24 to 2024-08-13. Microsoft's own Copilot Voice launched 2024-10-01, but its announcement says nothing of interruption."
