notes = "Role at the time: co-founder and chief executive of Anthropic (since 2021). Repeated unchanged on the Lex Fridman Podcast, 2024-11-11, about AI Safety Level 3 (ASL-3) ('I would not be surprised at all if we hit ASL-3 next year', answering a question about 'the timeline for ASL-3 where several of the triggers are fired'), and at the Council on Foreign Relations, 2025-03-10 ('We may actually hit that this year'). The seed list of 2026-10-17 keyed this claim to the Lex Fridman interview; the earliest saying with the same due year is this one, so the record is keyed here. Judgement call: the protections were switched on as a precaution, not on a finding that the model had crossed the line; read as 'the level's trigger fired', it is a hit on the company's word."
