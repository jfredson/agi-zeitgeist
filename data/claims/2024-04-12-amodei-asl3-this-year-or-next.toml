[claim]
id = "2024-04-12-amodei-asl3-this-year-or-next"
speaker_id = "amodei"
when = "2024-04-12"
when_note = "The show's own YouTube upload is dated 2024-04-12."
occasion = "The Ezra Klein Show (New York Times), episode 'What if Dario Amodei Is Right About A.I.?'"
source_kind = "transcript"
source_url = "https://www.youtube.com/watch?v=Gi_t3v53XRU"
source_locator = "1:02:27 to 1:02:32 into the video, answering how many years away AI Safety Level 3 and 4 are; his description of the levels at 58:36 to 1:01:00"
checked_how = "Read YouTube's automatic English captions of the upload on 2026-10-19 (no punctuation, some stutters); the quote is a verbatim run of those caption words."
quote = "I think asl3 is is you know could easily happen this year or next year"
prediction = "Anthropic's AI Safety Level 3 (ASL-3), the risk level in its own published safety policy that he said is 'triggered by risks related to misuse of biology and cyber technology', could easily be reached in 2024 or 2025. In the same interview he defined the biology part as a substantial increase, compared with using a Google search, in the risk that people misuse biology to make or spread weapons."
kind = "capability"
bar = "His definition in the same interview (58:59 to 1:00:21): a model reaches the point where, compared with using a Google search, it gives a substantial increase in the risk of misuse of biology to create bioweapons (or, he says, of cyber technology), as the national security community would judge it. Shown by a dated finding, by Anthropic or an outside evaluator, that a model had crossed that line in 2024 or 2025. Protections switched on only as a precaution, because the line could not be ruled out, are not such a finding."
due = 2025
due_early = 2024
due_basis = "'this year or next year', said 2024-04-12: 2024 or 2025; the later year is taken and the earlier recorded."
repeated_on = [2024-11-11, 2025-03-10]
status = "missed"
verdict_on = 2025-12-31
verdict_why = "No record by the end of 2025 shows a model crossing the line he defined. Anthropic switched on its AI Safety Level 3 protections with Claude Opus 4 on 2025-05-22 'as a precautionary and provisional action', saying it had 'not yet determined' whether the model had passed the threshold, only that it could not rule the risk out. Its system cards for Claude Sonnet 4.5 (September 2025) said the same, and the one for Claude Opus 4.5 (November 2025) said only that the stricter safeguards 'were appropriate'. A precaution is not a record that the risk arrived, so the condition failed."
verdict_source = "https://www.anthropic.com/news/activating-asl3-protections"
evidence_by = "maker"
direction = "not_come"
search_ids = ["amodei-claims-011", "amodei-claims-017", "amodei-claims-026", "amodei-claims-032", "amodei-claims-073", "amodei-claims-074", "amodei-claims-075"]
notes = "Role at the time: co-founder and chief executive of Anthropic (since 2021). Repeated unchanged on the Lex Fridman Podcast, 2024-11-11, about AI Safety Level 3 (ASL-3) ('I would not be surprised at all if we hit ASL-3 next year', answering a question about 'the timeline for ASL-3 where several of the triggers are fired'), and at the Council on Foreign Relations, 2025-03-10 ('We may actually hit that this year'). The seed list of 2026-10-17 keyed this claim to the Lex Fridman interview; the earliest saying with the same due year is this one, so the record is keyed here. Test and status changed before merging on 2026-10-19. The test read 'Shown by Anthropic applying its ASL-3 standard to a model because of that risk', which counted a precaution as the event; it now uses his own definition from the same interview and asks for a finding that the line was crossed. The status changed from came true to did not. Only Anthropic's own records were found on the question; no later finding before 2025-12-31 that any model had crossed the line was found, and records after that date were not searched. Judgement call, flagged for me: the company's policy requires the protections when a model cannot be shown to be well below the line, so a reader could take the switch as the level being reached; on his own definition, a real rise in risk, it is not."
