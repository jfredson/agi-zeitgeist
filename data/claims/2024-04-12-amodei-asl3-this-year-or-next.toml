verdict_why = "On 2025-05-22 Anthropic switched on its AI Safety Level 3 (ASL-3) deployment and security standards with the launch of Claude Opus 4, because 'clearly ruling out ASL-3 risks is not possible' for chemical, biological, radiological and nuclear weapons. The same post says it had 'not yet determined' that the model definitely crossed the threshold; its policy requires the stricter level when a model cannot be shown to be well below it, so the trigger fired. Only Anthropic's word shows this."
