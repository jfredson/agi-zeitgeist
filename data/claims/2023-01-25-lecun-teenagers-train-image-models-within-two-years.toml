quote = "within a year or two you know any teenager in the parents basement is going to be able to do this"
prediction = "Within a year or two of January 2023, any teenager at home would be able to do what the big companies' image generators do: train their own image-making models on art found on the internet."
kind = "capability"
bar = "Plain reading of his words: by the end of 2025, a dated public record of a single person, with home equipment, training an image-making model of their own on images they collected, as the big companies train theirs. Adapting someone else's released model by further training is not the same thing and does not meet it."
due = 2025
