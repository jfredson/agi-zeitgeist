notes = "Role at the time: Meta's Chief AI Scientist (2018 to the end of 2025), the company's named chief scientist speaking for it. First entered as a hit, then changed to a miss with a test that added conditions he never said (home equipment only, a model built from scratch, adapting a released model not counting). Changed again before merging on 2026-10-19, after the independent check: the test is restored to his own words, with 'this' read from the sentences around it in the captions (re-read that day), and scored on what the dated record shows. His next sentence, 'eventually everybody is going to be able to use this kind of stuff and train their own models', has no date and is not the claim. Whether training a model from scratch at home was possible by 2025 does not decide it, since he did not say 'from scratch'."
