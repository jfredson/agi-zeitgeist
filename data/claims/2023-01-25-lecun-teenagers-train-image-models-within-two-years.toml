verdict_why = "No dated record was found of a person at home training an image-making model of their own by the end of 2025. What the record shows is narrower: further training of an openly released model on a home graphics card (Hugging Face's guide of 2023-01-26, about five hours on one consumer card), and a research team training a whole model from scratch on about $1,890 of rented computing (a paper of 2024-07-22). Neither is a person at home training their own model."
verdict_source = "https://huggingface.co/blog/lora"
evidence_by = "outside"
direction = "not_come"
search_ids = ["lecun-claims-048", "lecun-claims-049", "lecun-claims-050"]
notes = "Role at the time: Meta's Chief AI Scientist (2018 to the end of 2025), the company's named chief scientist speaking for it. First entered as a hit on the reading that adapting an open model counts; changed before merging on 2026-10-19 because a hit needs a dated record of the thing itself happening, not of it becoming possible (the managing session's ruling, applying the method's status words). The verdict rests on the absence of such a record, so a later find could show it."
