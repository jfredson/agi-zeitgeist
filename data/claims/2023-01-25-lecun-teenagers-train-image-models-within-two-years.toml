verdict_why = "Hugging Face's guide of 2023-01-26 shows a full further training of the openly released Stable Diffusion image model on one's own chosen images 'in a 2080 Ti with 11 GB of VRAM', a home graphics card, in about five hours. It was already within reach of one person before he spoke: on 2022-11-01 Andy Baio reported that a student had trained such a model on 32 of the illustrator Hollie Mengert's drawings, on a hired graphics card, in about 2.5 hours for under $2. Every condition of his words was met inside the window."
