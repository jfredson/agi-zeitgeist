verdict_why = "Mercedes confirmed series production of the new CLA at Rastatt by 2025-06-04 (electrive, which does not mention Nvidia). Only Nvidia's own blog of 2026-01-05 says the CLA's driver-assistance features are 'powered by NVIDIA's full-stack DRIVE AV software'. Production in 2025 is shown by an outside report; that the car runs Nvidia's whole stack rests on Nvidia's word alone. The features are driver assistance; the fuller point-to-point driving was still to come in 2026."
