notes = "Role at the time: co-founder and chief executive of Nvidia (since 1993), which designs the chips frontier AI models are trained on. A changed repeat of the 2024-03-18 claim (from shipping by early 2025 to production during 2025). Repeated unchanged at CES on 2025-01-06: 'a fleet of cars coming with Nvidia starting ... this year going to production' (1:08:22 of https://www.youtube.com/watch?v=k82RwXqZHY8). Test changed before merging on 2026-10-19: it read 'Mercedes cars running Nvidia's self-driving (driver-assistance) software entering series production during 2025', now names the 'entire stack' of his own sentence, because the earlier test narrowed his words to driver assistance. The record was electrive's report of 2025-06-04; it is now Nvidia's blog, the only record that the car runs Nvidia's software, so the evidence is marked as the maker's word. The hit is softer than it looks: electrive (2026-01-07) says Mercedes works with Nvidia on its point-to-point system in the US 'and potentially in Europe in the future', and uses Momenta's software in China. Quote corrected the same day from the clean caption track; the automatic captions read 'the jlr Fe Fleet'."
