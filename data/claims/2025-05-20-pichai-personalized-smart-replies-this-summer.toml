notes = "Role at the time: chief executive of Google from 2015-10-02 and of its parent Alphabet from 2019-12-03; Google builds the Gemini models and its own AI chips. First found by the research pass and not entered because nothing settled it; entered by the lead on 2026-10-19, because leaving out claims that cannot yet be settled would choose them by outcome. Not the same as the contextual smart replies Google rolled out on 2024-09-27. Judgement call, made on 2026-10-19: the Suggested Replies of 2026-01-08 are taken as the promised feature, since they draft replies in the user's own tone; Google does not say they draw on Drive files as promised. If they are not the same feature, the direction would be 'has not come'. The record was a report of the announcement; it is now Google's own post. Changed by the lead before merging on 2026-10-19: the re-pass had read the Suggested Replies of 2026-01-08 as the feature arriving late; since no record shows them using Drive files as promised, the direction is has not come."
