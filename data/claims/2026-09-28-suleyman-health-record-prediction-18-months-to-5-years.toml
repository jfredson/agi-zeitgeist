notes = "Role at the time: chief executive of Microsoft AI (from 2024-03-19). The passage, in the captions: 'I absolutely guarantee that sometime in the next few years we are going to have a coding moment for healthcare we will stream an accurate prediction of what's going to happen in the electronic health record. Um, and it will be breathtaking. We will know with high confidence the likelihood that you're going to get all kinds of conditions in hospital, outside, so on and so forth. ... It is going to happen. I hope it happens in the next 18 months. We've just done a partnership with ... the Mayo Clinic, to do a big research program to train a new foundation model for health from scratch to do this. It might be 5 years, I don't know, but it is definitely going to happen.' He goes on: it will 'reduce the cost of production of super intelligent healthcare to near zero marginal cost just like coding is now'. 'Super intelligent healthcare' is his phrase for this one field, not a forecast of superintelligence, so the claim is a capability claim and is not drawn among the forecasts of AGI. Reading the hope ('I hope ... 18 months') and the hedge ('It might be 5 years, I don't know') as the two ends of one range is a judgement, flagged for me. Related but separate: 2025-12-16-suleyman-ai-diagnosis-free-to-everybody-by-2030-or-2035 (diagnosis from Microsoft's orchestrator, free to all), which is about cost and reach, not prediction from the health record."
