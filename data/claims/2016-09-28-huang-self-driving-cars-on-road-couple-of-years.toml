notes = "Role at the time: co-founder and chief executive of Nvidia (since 1993), which designs the chips frontier AI models are trained on. The words are about self-driving cars in general, not only Nvidia-powered ones, so Waymo's cars count. The same talk announced the Xavier chip ('samples end of next year'), a hardware date that is not entered. Waymo had made one trip with nobody at the wheel on public roads in 2015, before he spoke; the test asks for cars operating on public roads, not a single demonstration, which is why that trip does not settle it."
