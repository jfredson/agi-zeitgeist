notes = "Role at the time: co-founder and chief executive of Inflection AI. Repeated unchanged on X on 2023-06-15 ('I stand by my claim: 95% of the time means largely eliminated by June 2025', post 1669481907980206081). OpenAI is not his company, so the measurement is outside evidence, but it is made with OpenAI's own grading model and covers OpenAI's models only; no maker or outside body published a measurement of everyday answers showing 95% accuracy by June 2025. Judgement call on direction: one model in one mode reached about the line two months late on its maker's grader, while the default model did not, so the claim is entered as not come rather than come late. In the Financial Times interview published 2026-02-12 he said 'I stand by the statement that they've been largely eliminated' while granting that models 'still do make mistakes'; his own word is not taken as the verdict. Restated with a changed condition at the Nasscom Technology Leadership Forum on 2024-02-20 (2024-02-20-suleyman-hallucinations-largely-eliminated-next-year)."
