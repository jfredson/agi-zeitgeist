verdict_why = "He replaced the date himself. At the World Economic Forum on 2026-01-22 he said 'we might have AI that is smarter than any human by the end of this year and I would say no later than next year', moving the date from the end of 2025 (or April 2026) to the end of 2026 or 2027. Nobody has shown or announced an AI smarter than the smartest human. Counted as missed, as the rule says for a withdrawn claim."
