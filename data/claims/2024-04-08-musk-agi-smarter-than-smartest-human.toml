notes = "A judgement call: there is no agreed test for 'smarter than the smartest human', so the record rests on his own later words moving the date, not on a benchmark. The 2026 restatement is its own record, 2026-01-22-musk-ai-smarter-than-any-human-end-of-year. The seed list of 2026-10-17 had this as missed; withdrawn is the status word the method gives a claim its maker replaced, and it counts the same."
