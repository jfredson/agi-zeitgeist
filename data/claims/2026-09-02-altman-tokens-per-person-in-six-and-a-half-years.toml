notes = "Role at the time: chief executive of OpenAI (co-chair from its founding in 2015 to March 2019, chief executive since), a company that builds frontier AI models. Admitted as a forecast of how much AI will be used, which the method counts as deployment ('a billion users by Y'), not as a business forecast: he endorses the projection ('which seems like a reasonable thing to do to me') and does not call it a hypothetical. In the same breath he gives the heaviest single user at 100 trillion and at 100 quadrillion tokens a month, correcting himself both ways ('No, I was right. 100 trillion tokens a month. 100 quadrillion tokens a month.'); the two figures disagree and only a maker could know either, so the bar uses the average he gives once. His starting figures (100,000 tokens a month per person on Earth in mid-2026) are his own and not checked here. 'Let's round it down' is his. A count, if it comes, will most likely be a maker's, and the verdict will say so."
