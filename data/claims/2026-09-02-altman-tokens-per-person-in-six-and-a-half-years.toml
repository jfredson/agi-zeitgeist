prediction = "Projecting forward the growth he says happened from the start of 2020 to the middle of 2026 (average use per person on Earth from about zero to 100,000 tokens a month), which he calls 'a reasonable thing to do', average use of AI per person on Earth reaches about 100 billion tokens a month in another six and a half years. He says tokens are a poor unit, used as shorthand for 'amount of intelligence'."
