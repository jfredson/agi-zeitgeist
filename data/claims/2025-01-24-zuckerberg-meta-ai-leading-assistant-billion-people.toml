verdict_why = "On 2025-07-30 he told investors that Meta AI's 'reach is already quite impressive with more than a billion monthly actives', and no rival reported a larger monthly figure in 2025. Both conditions rest on Meta's own count, which includes anyone who used Meta AI inside its apps; rivals mostly reported weekly users. In the same months he called making Meta AI 'the leading personal AI' a focus still to be reached, which suggests he did not regard it as leading on quality."
