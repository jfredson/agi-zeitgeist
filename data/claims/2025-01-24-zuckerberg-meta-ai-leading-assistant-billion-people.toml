source_locator = "the post, second sentence"
checked_how = "Read on 2026-10-19 in the post text Threads serves to link previews (curl), and in the Internet Archive's copy of 2025-03-11."
quote = "In 2025, I expect Meta AI will be the leading assistant serving more than 1 billion people"
prediction = "During 2025 Meta AI would be the leading AI assistant and would serve more than a billion people."
kind = "deployment"
bar = "Two conditions: Meta AI used by more than a billion people during 2025, and Meta AI the leading assistant, used by more people than any other. The first may rest on Meta's own count; the comparison with rivals must be shown by an outside count."
due = 2025
due_basis = "'In 2025'; judged at 2025-12-31."
restates = "2024-07-23-zuckerberg-meta-ai-most-used-by-end-of-year"
repeated_on = [2025-01-29]
status = "missed"
verdict_on = 2025-12-31
verdict_why = "The first condition was met and the second is not shown. On 2025-07-30 he told investors that Meta AI's 'reach is already quite impressive with more than a billion monthly actives' (Meta's own count). But on the same call he named 'making Meta AI the leading personal AI' as the focus still ahead, and no outside count in 2025 showed Meta AI used by more people than any other assistant. OpenAI said on 2025-10-06 that more than 800 million people used ChatGPT every week, a measure Meta's monthly count cannot be set against, and a Pew survey of US adults in February 2026 put ChatGPT far ahead of Meta AI."
verdict_source = "https://s21.q4cdn.com/399680738/files/doc_financials/2025/q2/META-Q2-2025-Earnings-Call-Transcript.pdf"
evidence_by = "maker"
direction = "not_come"
search_ids = ["zuckerberg-claims-042", "zuckerberg-claims-027", "zuckerberg-claims-029", "zuckerberg-claims-077", "zuckerberg-claims-079", "zuckerberg-claims-080", "zuckerberg-claims-081"]
notes = "Role at the time: founder and chief executive of Meta (Facebook). Restates the 2024 most-used claim with a new year and a new condition (a billion people). Repeated on the fourth-quarter 2024 earnings call (2025-01-29): 'I expect Meta AI to be that leading AI assistant'. Changed before merging on 2026-10-19: it was scored as came true on Meta's count and on no rival having reported a larger monthly figure; under the re-pass rule of that day every condition must be shown and a maker's word about its rivals needs an outside comparison, so 'leading' is not shown and the claim is scored as not come true. The test now says so; it read 'Shown by user counts from Meta or outside'. 'Leading' is read as most used, because the sentence ties it to the number served; read as best in quality it is not shown either."
