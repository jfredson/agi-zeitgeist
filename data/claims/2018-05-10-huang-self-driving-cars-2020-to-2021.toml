notes = "Role at the time: co-founder and chief executive of Nvidia (since 1993), which designs the chips frontier AI models are trained on. Test changed before merging on 2026-10-19: it read 'A car sold or leased to the public that drives itself with no one needing to watch the road, at least in some conditions (Level 3 or above), on the market by 2021-12-31', now follows his own usage in the sentence just before ('the ASPs for Level 2 could be a few hundred dollars to a Level 5 self-driving car, taxi, or driverless taxi being a few thousand dollars'), because the test must use the speaker's own usage in the same source. The old test was written after Honda's Level 3 car was known and made this a hit. 'Probably' is kept as a hedge. As of 2026-10-19 no car sold to the public drives itself with no driver needed, so the direction is 'has not come'."
