notes = "Role at the time: co-founder and chief executive of Anthropic (since 2021). The New York Times transcript could not be opened (it asked for a check that the reader is human), so the show's own video was used. Anthropic called the release 'still experimental' and 'at times cumbersome and error-prone'; the test does not ask how well it worked, and he said 'with increasing levels of ability'. 'All of that' in his words also took in booking a car, reserving a restaurant and talking to the other people on a trip; the test keeps the general part, acting on websites and the user's computer. The words before it describe 'the model being able to kind of do things end to end or going to websites or taking actions on your computer for you'."
