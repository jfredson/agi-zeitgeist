verdict_why = "On 2024-10-22 Anthropic released 'computer use' to developers, in public beta: Claude operating a computer the way people do, by looking at the screen, moving a cursor, clicking buttons and typing. Other companies released similar agents in 2025. The release is the evidence; how well it worked is not part of the bar."
