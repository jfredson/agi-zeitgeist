notes = "Role at the time: founder and chief executive of Meta (Facebook). Hedged with 'it's possible'. He said the same idea two weeks earlier at the F8 developer conference (2016-04-12), in looser words, as part of a ten-year roadmap ('Artificial intelligence will power all kinds of different services with better than human level perception', read only in a third-party transcript), and repeated it in his note 'Building Jarvis' (2016-12-19): 'within 5-10 years we'll have AI systems that are more accurate than people for each of our senses', adding touch. An earlier version from his Facebook question-and-answer session of 2015-06-30 survives only in press reports and was left out (see the search log)."
